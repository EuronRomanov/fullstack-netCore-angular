<section class="app-header  pt-5 ">
    <div class="container">
         <div class="row align-items-center ">
        <div class="col-2 app-icon" routerLink="/">
            <img src="/assets/logo.png" />
        </div>
        <div class="col-7">
            <form class="form-inline search-form">
                <div class="input-group align-items-center">
                    <input class="form-control rounded  mr-sm-2 py-2" type="search" placeholder="Search"
                        aria-label="Search" />
                    <mat-icon class="input-group-append search-icon">search</mat-icon>
                </div>
            </form>
        </div>
        <div class="col-3 text-end header-btn-grp">
            <button mat-icon-button>
                <mat-icon>favorite</mat-icon>
            </button>
            <button mat-icon-button>
                <mat-icon>shopping_bag</mat-icon>
            </button>
        </div>
    </div>
    <div class="row pb-2">
        
        <div class="col-8">
            <nav class="navbar navbar-expand-lg navbar-light px-3">
                 <button mat-flat-button [matMenuTriggerFor]="menu" class="categorie-btn" >
                <mat-icon>grid_view</mat-icon>
                Categories
            </button>
            <mat-menu #menu="matMenu">
                <button mat-menu-item *ngFor="let cat of categories">
                    <span>{{cat}}</span>
                </button>

            </mat-menu>
                <div class="container-fluid">
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" routerLink="/" routerLinkActive="router-link-active">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link"  routerLink="/product" routerLinkActive="router-link-active">Products</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link"  routerLink="/about" routerLinkActive="router-link-active">About</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link"  routerLink="/help" routerLinkActive="router-link-active" tabindex="-1" aria-disabled="true">Help</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </div>
    </div>
    </div>
   
</section>
