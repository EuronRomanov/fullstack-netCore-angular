<section class="py-5 container">
    <div class="row align-items-center ">
        <div class="col-2 app-icon" routerLink="/">
            <img src="/assets/logo.png" />
        </div>
        <div class="col-7">
            <form class="form-inline search-form">
                <div class="input-group align-items-center">
                    <input class="form-control rounded  mr-sm-2 py-2" type="search" placeholder="Search"
                        aria-label="Search" />
                    <mat-icon class="input-group-append search-icon">search</mat-icon>
                </div>
            </form>
        </div>
        <div class="col-3 text-end header-btn-grp">
            <button mat-icon-button>
                <mat-icon>favorite</mat-icon>
            </button>
            <button mat-icon-button>
                <mat-icon>shopping_bag</mat-icon>
            </button>
        </div>
    </div>
    <div class="row">
        <div class="col-2">
            <button mat-flat-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
                <mat-icon>grid_view</mat-icon>
                Categories
            </button>
            <mat-menu #menu="matMenu">
                <button mat-menu-item *ngFor="let cat of categories">
                    <span>{{cat}}</span>
                </button>
                
            </mat-menu>
        </div>
        <div class="col-8">

        </div>
    </div>
</section>
